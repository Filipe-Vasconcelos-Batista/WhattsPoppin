project: WhattsPoppin - self-hosted federated chat app
languages: >
  Bilingual documentation - this file is the English version; the Portuguese
  version is projeto-chat-selfhosted.yaml, in the same folder. Both always
  change together.
domain: whattspoppin.io (or similar) - to be handled later (DNS, certificates, etc.)
license: AGPL-3.0 (the owner's choice, not imposed by any library)
version: >
  0.1.0 (MVP done; SemVer - in 0.x the API and the protocol may still change).
  In progress: 0.2.0 - federation between servers (see next_version and federation).
  The path to 1.0.0 is in version_1_0, and what comes after in future_1_x
mvp: >
  Encrypted 1:1 text messages between two users of the same server, in a
  single client. No federation, groups, stickers or push in this first
  version - everything else is built on top of this.
concept: >
  WhatsApp-like app where each person (or group of friends) runs their own
  server. Servers federate with each other (like email), without depending
  on third-party infrastructure. End-to-end encryption, no external services
  for media (stickers/GIFs).

implementation_status:
  summary: >
    v0.1.0 - MVP done. Two or more users can create an account, see each
    other in the list and exchange real-time 1:1 text messages, end-to-end
    encrypted (our own X3DH + Double Ratchet), with an offline queue,
    message states, a live conversation list, "typing" and an editable
    display name - tested across different devices on the same local
    network. Several pieces of the final design were consciously simplified
    to get here faster. What 1.0.0 must have, and in which order, is in
    version_1_0.
  built:
    - repository with frontend (Expo + React Native + TypeScript) and backend
      (FastAPI + Peewee + PostgreSQL), lint/typecheck/tests set up on both
      sides
    - real sign-up and login (username + password, bcrypt hash) - session
      stored as a token on the device, resumed automatically
    - >
      session authentication everywhere (F0 of 0.2.0) - REST requires
      Authorization: Bearer <token>, /ws requires {type: auth, token} as the
      first message (without it within 5 s, or with an invalid token, it
      closes with 4401) - the token never goes in the URL, so it doesn't end
      up in logs. The user and device always come from the session, never
      from ids sent by the client. The DB only keeps the SHA-256 of the
      token (token_hash), and inactive devices cannot resume a session.
      Messages, receipts, "typing" and a conversation's device list only
      work for its participants (anyone else gets 404 and doesn't learn the
      conversation exists); prekey bundles require a session, so nobody
      outside can drain the OPKs
    - >
      user@domain identifier (F2 of 0.2.0) - each server has its own
      SERVER_NAME and each account an identifier (e.g. alice@localhost:8001),
      returned on login/session and shown in "My profile". users.domain is
      NULL for local accounts (only F4's shadow users fill it in), so
      changing SERVER_NAME doesn't rewrite accounts; the username is unique
      per domain, with two partial indexes. Usernames are lowercase (sign-up
      and login convert them), 3-32 characters from a-z 0-9 . _ -
    - >
      two servers in dev - dev/federation.sh starts everything in a single
      terminal (Postgres, B's DB if missing, both servers and both web
      clients, prefixed per process; Ctrl+C stops everything). Underneath,
      backend/dev/run-server.sh a|b starts server A
      (localhost:8001, dev DB) or B (localhost:8002, whattspoppin_b DB), with
      migrations and --host 0.0.0.0; npm run web:a|web:b starts each one's
      web client (ports 8091/8092, separate localStorage). The frontend works
      out the backend address by itself - on the web from the page's host,
      in the native app from the Expo dev server's host - with
      EXPO_PUBLIC_API_URL to force another one
    - the conversation list shows every user on the server; a conversation
      is only created in the DB the first time it is opened (get_or_create,
      not pre-created on sign-up)
    - real-time 1:1 text messages over WebSocket
    - the list updates by itself when someone new signs up (user_registered
      event), no refresh
    - the WebSocket reconnects by itself if the backend goes down/restarts
    - messages persist on the device (AsyncStorage/localStorage) per user,
      and survive a page refresh
    - UI split into small reusable components (Avatar, MessageBubble,
      GradientButton, etc.)
    - end-to-end encryption in 1:1 - each device publishes IK, a signed SPK
      and 20 OPKs; the first message opens an X3DH session, then Double
      Ratchet (a new key per message). The sender encrypts one envelope per
      recipient device, the server delivers to each only its own and never
      sees the text. Design and decisions in the encryption section
    - pytest on its own DB (TEST_DATABASE_URL, the name must end in _test) -
      never touches the dev DB
    - offline queue on the server (pending_messages table) - one row per
      encrypted envelope per recipient device, delivered on connect ordered
      by created_at, deleted only on that device's ack (so it only leaves
      the server when ALL devices have confirmed). The client deduplicates
      by (sender_device_id, client_message_id). Expires after 30 days
      without an ack
    - pending/sent/delivered/read message states on the bubble - a local
      outbox on the sender (encrypts once, resends the same bytes on
      reconnect), "sent" when the server stores it, "delivered" generated by
      the server on the recipient's ack, "read" when the recipient opens the
      conversation. Receipts go through the same queue (pending_messages);
      they only carry ids, never content
    - conversation list with the last message, time (today HH:MM,
      "Yesterday", weekday, date) and unread count; the most recent
      conversation moves to the top. The list is per user and messages are
      per conversation - the bridge (conversation_id → user_id) comes from
      other_users[].conversation_id on login/session and from the
      sender_user_id the server adds to each message (taken from the
      connection, never from the client). "Unread" is local state (seen),
      separate from the read receipt - opening the conversation with the
      socket down still clears the counter. On the web, the tab title shows
      the unread total
    - >
      "typing" indicator - typing event on the WebSocket, relayed only to
      the connected devices of the conversation (never queued, never in the
      DB); shows as a three-dot bubble at the bottom of the conversation and
      as "typing…" in the list. Details in
      message_delivery_and_state.typing
    - editable display name on the "My profile" screen (settings button in
      the list). Starts as the sign-up username; PATCH
      /users/me/display_name with the session token (trimmed, 1-80
      characters); the server notifies the other connected devices with the
      user_updated event, and their list updates without a refresh. The
      username (to log in) doesn't change
  temporary_simplifications:
    - encryption only in 1:1 and with known rough edges - simultaneous
      session starts may lose the messages that cross (no session archive),
      no SPK rotation, no automatic OPK replenishment
    - no federation - there is a user@domain identifier now, but no
      .well-known, request signing or federated_servers yet, and the two dev
      servers don't talk to each other (that is the rest of 0.2.0, see
      next_version)
    - no nicknames or ambiguity detection - the display name is always shown
    - open registration, no invite code or admin approval
    - >
      the conversation list shows every member of the server - goes away in
      0.3 (only accepted contacts) and comes back as an option in directory
      mode (see server_modes)
    - >
      conversation with yourself is broken - get_or_create_conversation(a, a)
      returns another of the user's conversations or fails with a 500, and
      find_recipient_device_ids excludes the user's own devices. Fixed in 0.5
    - login screen without a "Server" field (always assumes this server)
    - read receipts always on (no privacy option) and no "failed" state - a
      message that cannot be encrypted stays pending
    - client messages live in localStorage/AsyncStorage, not IndexedDB - a
      conscious decision not to optimise prematurely (quota ~5-10MB, far
      above current use)
  missing:
    - protect data on the device - today, on the web, messages AND private
      keys are in localStorage unencrypted. Requirement - being able to use
      the web client on any machine, including shared ones. Design (outside
      the MVP) in encryption.on_device_data_protection
    - nicknames, ambiguity detection
    - key backup and restore (practically all of it, depends on encryption)
    - multi-device - today each new login creates a Device with no link to
      the previous ones, and no history sharing between them
    - federation (in progress, 0.2.0), groups, stickers/GIFs, QR codes, push
      notifications
    - invites (server and contact), contact requests and the end of the
      global user list
    - encrypted attachments (see encrypted_attachments)
    - administration (roles, moderation, admin screen)
    - one-command installation (see installation)
    - Android and desktop apps (Tauri - Linux and Windows)
    - the order of all this is in version_1_0

next_version:
  version: 0.2.0
  theme: federation between servers
  goal: >
    alice@server-a and bob@server-b exchange encrypted 1:1 messages across
    two independent servers, with offline queue, receipts and "typing",
    without the client talking to any server other than its own. Finishing
    this marks 0.2.0.
  why_now: >
    Federation is what sets the project apart and it is the piece that
    touches the most of what already exists (identifiers, data model,
    delivery). Missing pages, invites, admin and on-device data protection
    don't change because of it, so they come later; authentication between
    servers is part of federation itself and is not postponed.
  phases:
    F0: >
      done - real local authentication - /ws and REST endpoints require the
      session token, the user/device come from it and not from the client
      (details in implementation_status.built)
    F1: protocol written in the federation section of this yaml
    F2: >
      done - user@domain identifier (domain column in users, NULL for local
      accounts) + dev environment with two servers (two DBs, ports
      8001/8002, web clients on 8091/8092) - details in
      implementation_status.built
    F3: >
      server identity - signing key, .well-known, request signing and
      verification, federated_servers table (TOFU)
    F4: remote profile, shadow users, "Add contact" screen
    F5: remote devices and prekey bundles proxied through the local server
    F6: >
      federated delivery - federation_outbox + worker with backoff,
      PUT /_federation/v1/send/{txn_id}, delivered/read receipts across servers
    F7: >
      "typing" and name changes across servers (ephemeral, no retry)
  done_when: >
    Two local servers with one client each - add a contact from the other
    server, exchange messages both ways with ✓/✓✓/read, stop server B, send,
    restart it and the message arrives, "typing" across servers, and
    changing server B's key makes A refuse it.
  out_of_scope: >
    identity verification (safety number/QR - the priority right after,
    because keys start coming from servers we don't control), HTTPS
    deployment, admin screen, groups

version_1_0:
  what_it_means: >
    Under SemVer, 1.0.0 is a promise - from then on the federation protocol
    and the data format only change with notice and a migration path,
    because other servers and people's data start depending on them. So it
    is only called 1.0 when (1) a stranger can install the server at home,
    invite friends and talk to another server, and (2) no temporary security
    simplification is left.
  focus: privacy over convenience - when in doubt, the default is the most private option
  platforms: >
    web, Android and desktop with Tauri (Linux as Flatpak; Windows comes out
    of the same code). iOS and macOS are left for 1.x (see future_1_x).
  done_when:
    - >
      one-command installation (see installation), with HTTPS, on a real
      domain, and the owner created by the script or by the claim code
    - >
      registration by invite only; the conversation list only shows accepted
      contacts, never every member of the server
    - >
      add a contact by invite (QR, link or code) with automatic key
      verification, and by user@domain if the admin allows it
    - >
      safety number and QR verification; a clearly visible warning when a
      contact's key changes
    - >
      federation working between real servers, with pinned keys (TOFU) and
      domain blocking
    - encrypted attachments (images and files), without EXIF and with padding
    - conversation with yourself, synced across your own devices
    - >
      every limitation in encryption.known_limitations resolved (except
      groups, which are left for 1.x) and a security review done
    - data protected on the device on every platform
    - Android and desktop (Tauri) apps working alongside the web
  path:
    '0.2':
      theme: federation (in progress, issue #19)
      content: see next_version
    '0.3':
      theme: contacts and invites
      content:
        - registration closed behind a server invite (QR / link / code)
        - contact invite carrying the identity key - the contact is verified when scanned
        - >
          contact requests - nobody can message you before you accept
        - >
          add by user@domain, only if the admin turns the option on
          (contacts_by_identifier, off by default)
        - end of the global list - the list only shows accepted contacts
        - safety number and QR verification (issue #3)
        - nicknames and name ambiguity detection
    '0.4':
      theme: hardened encryption and devices
      content:
        - on-device data protection (issue #4)
        - '"My devices" screen - list, revoke, log out (issue #5)'
        - OPK replenishment (#6), session archive (#7), SPK rotation (#8), cap on skipped keys (#9)
        - app lock with a PIN
    '0.5':
      theme: encrypted attachments and conversation with yourself
      content:
        - encrypted attachments (see encrypted_attachments) - design written before the code
        - conversation with yourself - a conversation with a single
          participant, delivered to the user's other devices
    '0.6':
      theme: a server ready for other people
      content:
        - installation script and production Docker image (see installation)
        - minimal administration - invites, members (kick/ban), federated servers
        - privacy settings - read receipts and "typing" can be turned off, block list
        - configurable queue retention and limits (issue #16)
        - locked-down CORS, strict Content-Security-Policy
    '0.7':
      theme: apps
      content:
        - Android - camera for QR, content-free FCM push, direct APK / F-Droid
        - Tauri desktop - Linux (Flatpak) and Windows, keys in the OS vault (see desktop)
    1.0-rc:
      theme: freeze and review
      content:
        - federation protocol v1 frozen
        - security review (issue #11) - external if possible, otherwise internal, written and public
        - installation and version-migration documentation
  screens:
    already_exist: [Login, Sign up, Conversation list, Conversation, My profile]
    new:
      - Sign up with invite (code or QR required)
      - Add contact (scan QR, paste link, or user@domain if allowed)
      - My invite (my contact QR/link; revoke and generate a new one)
      - Contact requests (accept / decline)
      - Contact details (safety number, verify by QR, nickname, block, verified state)
      - My devices (list, revoke, log out)
      - Privacy settings (receipts, "typing", app lock, blocked users)
      - Administration (invites, members, federated servers, server options)
    note: >
      several of these are already designed on the canvas (see
      screens_designed_on_canvas) - Add contact, My QR code, Scan code and
      Administration
  outside_1_0: see future_1_x

future_1_x:
  server_modes: >
    Directory and Open/ephemeral (see server_modes). 1.0 ships with the
    Private mode only, but the code is ready for the others to come in
    without changing the protocol.
  groups: Sender Keys (see group_scheme, issue #10)
  disappearing_messages: vanish after a period chosen per conversation - good for privacy and fairly simple
  multi_device: link a new device by QR, sharing the history (see multi_device)
  backup: >
    rethink before implementing - the current design (key_backup_and_restore)
    stores the backup key on the server, which falls short of the privacy
    focus
  themes: app themes chosen by the user (an extension of bubble_customisation)
  stickers_and_gifs: see stickers_and_media
  platforms: iOS and macOS (require an Apple developer account, USD 99/year)

stack:
  frontend:
    framework: React Native (via Expo, supports web builds natively)
    platform_order: [web (MVP), mobile Android, desktop Linux and Windows (Tauri)]
    web: React Native Web - the first client to exist, used for the MVP
    mobile: React Native - Android first (cheaper/simpler to test, no Apple
      Developer cost or store review). iOS is left for 1.x.
    desktop: >
      DECIDED - Tauri wrapping the web build (Expo doesn't produce desktop
      apps). Linux and Windows come out of the same code; details in
      desktop.
    encryption_on_native_mobile: >
      SOLVED by the library change (see the encryption section) - our own
      Double Ratchet implementation uses @noble/curves,hashes,ciphers, which
      are pure JavaScript/TypeScript with no WASM. It runs exactly the same
      on Hermes (mobile) and in the browser (web), with no native Rust/JSI
      bridge needed.
  backend:
    language: Python
    framework: FastAPI (native WebSockets, async)
  database:
    engine: PostgreSQL
    orm: Peewee (synchronous, called from FastAPI via run_in_threadpool)
      - swapped from the initial choice (SQLAlchemy) for being simpler and more readable
    model: logical multi-tenant (isolation by user_id, not separate databases)
  encryption: >
    Our own X3DH + Double Ratchet (Signal specs) on top of @noble/curves,
    @noble/hashes and @noble/ciphers. The server never sees content. Design,
    decisions and limitations in the encryption section.
  infrastructure:
    hosting: physical machine at home, Docker container
    reverse_proxy: Caddy (automatic HTTPS via Let's Encrypt)
    dynamic_dns: DuckDNS or Cloudflare
    open_ports: [443, 80]
    ssh: only via VPN/LAN, never publicly exposed

encryption:
  why_our_own_implementation: >
    vodozemac (Olm/Megolm) was the initial choice, but its JavaScript
    bindings are all stalled - the official one archived, the community
    forks without updates for over a year, and the only maintained option
    is Matrix's whole OlmMachine, tied to their protocol's concepts. We
    implemented X3DH + Double Ratchet following Signal's specifications to
    the letter, on top of audited primitives (@noble/curves, @noble/hashes,
    @noble/ciphers - pure JS, no WASM, runs the same on Hermes and in the
    browser). We never invent cryptography, only the key chaining.
  specifications:
    - https://signal.org/docs/specifications/x3dh/
    - https://signal.org/docs/specifications/doubleratchet/
  primitives: >
    X25519 for DH; HKDF-SHA256 for the Double Ratchet's KDF_RK and for the
    X3DH KDF (each with its own info, for domain separation); HMAC-SHA256
    for KDF_CK; ChaCha20-Poly1305 as the AEAD, with a random 12-byte nonce.
    All in frontend/src/crypto/primitives.ts.
  keys_per_device: >
    Identity key (IK, Ed25519), signed prekey (SPK, X25519, signed by the
    IK) and 20 one-time prekeys (OPK, X25519, random 32-bit key_id).
    Generated on sign-up and login, public parts published on the server,
    private parts only on the device. The server hands out each OPK exactly
    once and deletes it.
  sessions: >
    One session per device pair (my device, the other's device), never per
    conversation or per user. The sender encrypts one envelope per recipient
    device and the server delivers to each only its own.
  decisions:
    ik_ed25519_reused_for_dh: >
      The IK is Ed25519 (it signs the SPK) and is converted to X25519
      (Edwards to Montgomery map) for the X3DH DHs. As the spec recommends
      for this key-reuse case, the KDF input carries the F prefix (32 bytes
      of 0xFF).
    spk_verification: >
      The initiator always verifies the SPK signature before any DH -
      without it, a compromised server could swap the SPK.
    associated_data: >
      AD = IK_A || IK_B (from X3DH). Each message authenticates AD || header,
      and the header is a fixed 40 bytes (dh 32, pn 4, n 4, big-endian) - so
      tampering with the header makes decryption fail.
    bobs_initial_ratchet_pair: his SPK, as the spec says
    repeated_prelude: >
      Alice puts the X3DH prelude on every message until she decrypts Bob's
      first reply, as Signal recommends - losing the first message doesn't
      stop the next one from opening the session. Bob tells "repeat" from
      "new session" by Alice's ephemeral key.
    opk_only_spent_after_decrypting: >
      The OPK is only deleted after the first message decrypts, so a
      tampered message cannot burn it.
    immutable_state: >
      Every ratchet operation returns a new state; if decryption fails the
      previous one stays intact, and it is only saved after success.
    serial_queue: >
      All encryption and decryption operations go through a queue, so two
      messages in a row don't save the same session at the same time.
    max_skip: >
      At most 1000 skipped keys per chain, and the header counters are
      validated.
    encrypt_once: >
      The sender's outbox keeps the already-encrypted envelopes; a resend
      sends the same bytes and the ratchet doesn't advance twice.
  known_limitations:
    - >
      No identity verification (safety number / QR, see qr_codes). Protects
      against network eavesdroppers, but not against a compromised server
      that swaps someone's keys. It is the most important gap.
    - No dedicated protection for data on the device (see on_device_data_protection)
    - >
      Simultaneous session starts may lose the messages that cross (a
      session archive is missing).
    - >
      No automatic OPK replenishment; once they run out, new sessions lose
      DH4 (valid per the spec, but weaker).
    - >
      No SPK rotation. Since the SPK is also Bob's first ratchet pair,
      rotation has to keep the old private key for a while.
    - No global cap on stored skipped keys (MKSKIPPED)
    - Each login creates a new device, and senders keep encrypting for the old ones too
    - >
      Our own implementation - an external security review is recommended
      before real use.
  on_device_data_protection:
    status: design, outside the MVP
    problem: >
      Keeping decrypted messages on the device is normal (WhatsApp and
      Signal do it too); the difference is that they protect that storage.
      Here, on the web, the messages AND the private keys sit in
      localStorage in the clear - readable by any script on the page (XSS)
      and by anyone with access to the browser profile, and they stay there
      after closing the app.
    requirement: being able to use the web client on any machine, including shared ones
    design:
      - >
        A single encrypted storage module (e.g. storage/vault.ts) that keys,
        sessions and messages all go through, reusing the existing
        aeadEncrypt/aeadDecrypt.
      - Mobile - storage key in expo-secure-store (Keychain/Keystore)
      - >
        Web on your own machine - non-extractable WebCrypto key in IndexedDB
        (protects against copying the profile, not against XSS).
      - >
        Web on any machine, by default - key derived from a PIN/passphrase
        with Argon2id (already included in @noble/hashes), never stored.
      - Optional "public computer" mode - nothing persisted, memory only
      - >
        Logout deletes the local keys, sessions and messages, and
        deactivates the device on the server.
      - >
        A new machine starts without history; history comes through QR
        linking (multi_device) or backup (key_backup_and_restore).
      - >
        XSS remains the residual risk on the web - strict
        Content-Security-Policy and zero third-party scripts.
      - Migration of any data that already exists in the clear, on first run
  remaining_work: >
    In the GitHub issues - identity verification, on-device data protection,
    OPK replenishment, session archive, SPK rotation, cap on skipped keys,
    groups (Sender Keys) and external review.

federation:
  status: design closed, implementation in progress (0.2.0, see next_version)
  protocol: >
    Our own, HTTPS + JSON, with the server-to-server endpoints under
    /_federation/v1/... Matrix and XMPP were ruled out - Matrix is huge
    (rooms as a DAG, state resolution) and tied to Olm/Megolm, which we
    dropped; XMPP would require another server or a new XML stack and
    swapping the encryption for OMEMO. A small protocol fits the encryption
    we already have.
  identifier: >
    user@domain (e.g. alice@casa.pt, or localhost:8001 in dev). The domain
    is the SERVER_NAME of the server where the account lives. In the DB,
    users.domain is NULL for local accounts and only filled in for shadow
    users; the code to format and parse identifiers is in
    backend/app/services/identifiers.py.
  discovery:
    endpoint: GET /.well-known/whattspoppin/server
    response: '{server_name, versions: ["1"], verify_keys: {"ed25519:1": <b64>}}'
    versions: >
      the versions field says which protocol versions the server speaks -
      two servers on different versions pick the highest one in common
  server_key: >
    Ed25519, generated on first start and stored in a file outside the DB
    (SERVER_SIGNING_KEY_PATH), for the same reason as the master_key - a
    stolen DB dump is not enough for someone to impersonate the server.
  request_authentication:
    mechanism: >
      Every server-to-server request is signed (not just the first), in a
      Matrix-style header:
      Authorization: WP-Sig origin="a",destination="b",key="ed25519:1",ts="...",sig="..."
    what_is_signed: >
      canonical JSON {method, uri, origin, destination, ts, content_sha256}
    rejects: >
      ts outside ±5 minutes, a destination other than our SERVER_NAME, a
      blocked server, or a key different from the pinned one
  trust_in_the_remote_key:
    model: TOFU (trust on first use)
    how: >
      on first contact the key is fetched from .well-known (over HTTPS) and
      pinned in federated_servers. If the key is different later, it is
      refused and logged - never accepted silently.
    why_no_handshake: >
      the initial design had a bidirectional challenge + signature; with
      every request signed it is an extra round trip with no real gain
  federated_servers_table: [domain, verify_key, key_id, trust_status, first_seen_at, last_seen_at]
  modes:
    open: trusted automatically on first contact (the chosen default, the only one in 0.2.0)
    restricted: stays pending until an admin approves (comes with the admin screen)
  blocking: an admin can block a domain at any time (trust_status = blocked)
  who_can_start_federated_contact: any member, not just admins
  remote_users: >
    Stored as shadow users (a row in users with the remote domain and no
    password), and their devices as rows in devices with public keys only.
    That way conversations and participants keep using the same tables. A
    device id that already belongs to another domain is refused.
  conversations: >
    Conversation ids never leave the server. Federated events carry user
    identifiers (alice@a, bob@b) and each server maps them to its own local
    conversation (get_or_create_conversation). That way no server has to
    trust ids made up by another.
  client_only_talks_to_its_own_server: >
    Devices and prekey bundles of remote users are requested from your own
    server, which fetches them from the remote one (proxy). The client
    doesn't need CORS for other domains or reveal its IP to foreign
    servers, and the encryption in the frontend doesn't change.
  endpoints:
    - GET  /_federation/v1/users/{username}/profile       # {identifier, display_name}
    - GET  /_federation/v1/users/{username}/devices       # active devices with keys
    - POST /_federation/v1/devices/{id}/prekey-bundle     # POST because it spends an OPK
    - PUT  /_federation/v1/send/{txn_id}                  # {events: [...]}
  events:
    durable: >
      message and receipt - go through the sender's federation_outbox (see
      message_delivery_and_state.offline_federated)
    ephemeral: >
      typing and user_updated - a single attempt, no retry, never stored
  validation_on_the_receiver: >
    the sender's domain must equal the origin of the signed request, and
    the target device must belong to a local user. Duplicates (a resend
    after a timeout) are already dropped by the client by
    (sender_device_id, client_message_id).
  dependencies: >
    cryptography (the server's Ed25519) and httpx2 (HTTP client between
    servers, moves from dev to runtime - it is httpx's successor and what
    Starlette's TestClient already uses, so there is a single library). No Redis or Celery - the queue is a
    Postgres table and the worker an asyncio task in FastAPI's lifespan.
  tests: >
    Peewee uses a global DB, so two servers are not started in the same test
    process - incoming requests are tested with TestClient and a test key,
    outgoing ones and the worker with httpx2's MockTransport. The end-to-end
    test is manual, with two servers (8001/8002).

roles_and_administration:
  roles: [owner, admin, member]
  moderation:
    kick: removes, can sign up again with a new invite
    ban: removes and blocks the key/device (banned_devices)
  admin_screen:
    - federated servers (approve / reject / block / unblock)
    - members (kick, generate invites)
    - server options (contacts_by_identifier, and later the server mode)

server_modes:
  status: 1.0 only has the private mode; the others are left for 1.x (future_1_x)
  private:
    default: true
    registration: by invite only
    list: accepted contacts only
    example: family, friends
  directory:
    registration: only invites generated by an admin
    list: every member shows up automatically in everyone's list
    example: a company with all colleagues already in the list
  open_ephemeral:
    registration: anyone, no invite
    list: every member
    rotation: the DB is rotated (wiped) daily - accounts, keys and messages disappear
    example: a café's server so customers can meet each other
    caveats:
      - >
        abuse limits (accounts per hour per IP, rate limiting, a simple
        captcha) - an open server without limits means guaranteed spam
      - federation off by default, so it doesn't become an anonymous gateway to other servers
      - >
        clients have to recognise that the account expired after the
        rotation and go back to sign-up, instead of getting stuck in errors
      - end-to-end encryption stays; only the visibility of who exists changes
  why_private_by_default: >
    listing every member of the server to any user reveals who has an
    account there; showing the members has to be an explicit admin choice,
    never the default behaviour

contacts:
  rule: >
    Nobody can message you before you accept their contact request (or add
    them yourself through an invite).
  ways_to_add:
    contact_invite: >
      QR, link or code with user@domain + the identity key fingerprint (see
      qr_codes). Once scanned, the contact is verified straight away.
    by_identifier: >
      typing user@domain. Only works if the admin turns on
      contacts_by_identifier (off by default). The contact stays
      "unverified" until the safety numbers are compared.
  requests_from_other_servers: >
    to be decided at implementation time - proposal, OUR server's
    contacts_by_identifier option also decides whether we accept
    by-identifier requests coming from outside
  key_change: a clearly visible warning in the conversation and in the contact details; the contact goes back to "unverified"

identity_and_names:
  layers:
    1: technical identifier (user@server.pt) - never shown in the normal UI
    2: display name - chosen by the user, federated, visible to everyone
    3: nickname - only the account owner sees it, local, never leaves the server
  display_priority: nickname > display name > identifier
  ambiguity_detection:
    description: >
      When two nicknames/display names match (case-insensitive), both
      contacts are marked as ambiguous and the app shows the identifier in a
      vivid colour in the header (1:1 and in groups). It stays in the final
      version, it isn't just a mockup detail - it prevents impersonation.
    support_table: contact_name_counts (owner_user_id, effective_name_lower, count)
    reason: avoids recomputing the whole contact list on every name change
    update: incremental - only touches the few rows that share the name that changed
    propagation: the server computes it once and sends a contact_ambiguity_changed event
      over the WebSocket to every connected device, for multi-device consistency

bubble_customisation:
  colours: a closed list of presets (never free colour), per contact (received) and your own (sent)
  styles: [solid, outline, pattern]
  storage: local, never federated

message_delivery_and_state:
  states: [pending, delivered, read]
  online: delivered over WebSocket
  offline_local: stays pending, delivered on reconnect (ordered by created_at)
  offline_federated:
    mechanism: federation_outbox
    table: [id, destination, payload, attempts, next_attempt_at, status, created_at]
    flow: >
      the sender's server writes the envelope to federation_outbox (and
      sends the "sent" receipt right away - from then on it isn't lost); a
      worker sends in created_at order, per destination, with PUT
      /_federation/v1/send/{txn_id}; the receiving server puts it in the
      target device's pending_messages just like a local message
    worker: >
      asyncio task in FastAPI's lifespan; picks up due rows with
      FOR UPDATE SKIP LOCKED
    retry: exponential backoff capped at 1 hour, configurable max, then status = dead
  read_receipt:
    mechanism: same outbox, read_receipt event
  retention:
    server: >
      ephemeral - deletes the message once it has been delivered to ALL the
      recipient's active devices (not just the first). Never keeps long-term
      history, consistent with end-to-end encryption.
    client: >
      persists locally forever, in a simple table
      (messages: id, conversation_id, sender_id, decrypted_text, created_at),
      until the user deletes it. It is what goes into the encrypted backup
      (see key_backup_and_restore) and what travels when sharing between
      devices (see multi_device).
    mvp: the same model from the start, no simplification - the extra cost is minimal
      (a small table) and it avoids rebuilding this later
  typing:
    persistence: none - never stored in the DB
    retry: none - ephemeral event, WebSocket only
    client: debounce (~3s since the last keystroke), sends an explicit stop when sending a message
    implemented:
      sending: >
        typing=true on the first keystroke, repeated at most every 3s while
        typing; typing=false after 3s without keystrokes, on send, when all
        the text is deleted and when leaving the screen
        (messaging/typingSignal.ts)
      receiving: >
        expires by itself after 5s without a new event (covers a lost false
        or the other side dropping) and is cleared when a message from that
        conversation arrives
      server: >
        only relays to the conversation's devices that are connected right
        now, with sender_user_id taken from the connection

push_notifications:
  mobile:
    required: APNs (iOS) and FCM (Android), even without publishing to a store
    push_content: none - it only "wakes up" the app, which fetches and decrypts locally
    costs: [Apple Developer USD 99/year, Firebase free]
    install_without_store: [sideloaded apk (Android), TestFlight (iOS)]
  desktop:
    mechanism: >
      WebSocket always open + native notifications through Tauri's
      notification plugin (D-Bus on Linux, Windows notifications)
    external_push: not applicable
  web: browser notifications while the tab is open

qr_codes:
  registration_invite: "whattspoppin://join?server=...&invite=...&pin=<server-public-key-hash>"
  federated_contact: "whattspoppin://contact?id=...&key=<identity-public-key>"
  security: visual verification like Signal's "safety number"
  server_invite:
    who_generates: admin (and members, if the admin allows it)
    use: single use, with an expiry, revocable
    server_key_pin: >
      the invite carries the server key's fingerprint - the app refuses to
      sign up if the server answers with a different key (protects against
      someone impersonating the server)
  contact_invite:
    who_generates: any user
    revocable: yes - generating a new one invalidates the previous one
  three_ways_to_share: >
    QR (generated in the app; scanned with the camera on Android, with the
    webcam on desktop and web), whattspoppin:// link (paste) and a text code
    (no camera). QR is ideal, the link and the code make sure it always
    works.

stickers_and_media:
  upload: users upload images (stickers, GIFs, memes) to their own server -
    no external service, consistent with the rest of the project
  deduplication: >
    content-addressable storage - the image is stored only once, identified
    by the hash of its content (e.g. SHA-256). If the same image is sent or
    reused again, the server recognises the hash and doesn't store another
    copy - it just links (references) the existing image. Applies both to
    what is explicitly uploaded to the collection and to images used in
    conversations that become reusable as "memes".
  public_collection_only: >
    Deduplication applies only to the public sticker collection. NEVER to
    private attachments - deduplicating encrypted files requires using the
    same key for the same file (convergent encryption), and that reveals who
    has the same file. See encrypted_attachments.
  to_refine:
    - reference table (media_id/hash, who can reuse it, usage count)
    - collection management screen (outside the MVP)

encrypted_attachments:
  status: design, comes in 0.5 (required for 1.0)
  scheme: >
    The same as Signal's. The client generates a random key per file,
    encrypts the file in chunks (a large video doesn't fit in the browser's
    memory) and uploads only the encrypted blob to its OWN server. The
    end-to-end encrypted message carries {blob_id, key, hash, size, type,
    name, thumbnail}. The file is uploaded once; the key goes inside each
    envelope (one per recipient device). The server never sees the key, the
    name or the type.
  privacy:
    exif: >
      photos carry GPS, phone model and date - stripped on the client BEFORE
      encrypting. Essential.
    padding: the blob is rounded up to size buckets, so the exact size doesn't identify the file
    no_deduplication: random key per file, never convergent encryption (see stickers_and_media)
    thumbnails: generated on the client and sent encrypted inside the message - the server never generates previews
  retention: >
    the blob is deleted once every recipient device has confirmed the
    download, or after the same period as the offline queue. Needs its own
    download ack, separate from the message ack.
  federation: >
    someone on another server asks THEIR server for the blob, which fetches
    it from the remote one with a signed request - the client only talks to
    its own server (see federation.client_only_talks_to_its_own_server)
  limits:
    - maximum size per file and quota per user, configurable by the admin
    - chunked upload that resumes if the connection drops
    - >
      the server cannot scan the files for malware - that is the price of
      encryption, and it is accepted
  to_refine:
    - AEAD for the chunks (proposal - chunked XChaCha20-Poly1305, from @noble/ciphers)
    - padding buckets
    - default values for the limits

desktop:
  technology: Tauri wrapping the Expo web build
  why: >
    Expo doesn't produce desktop apps; Tauri uses the system's web engine, so
    the app stays light (unlike Electron), and the same code serves Linux
    and Windows
  per_system:
    linux:
      web_engine: WebKitGTK
      keys: Secret Service (libsecret)
      links: whattspoppin:// registered in the .desktop file
      package: Flatpak (and AppImage)
      planned_permissions: [network, notifications, camera (QR scanner), files (media)]
      distribution: Flathub or self-hosted (.flatpakref on your own domain)
    windows:
      web_engine: WebView2 (ships with Windows 10/11)
      keys: Credential Manager / DPAPI
      links: whattspoppin:// registered by the installer
      package: .msi / .exe
  real_costs:
    build: >
      Windows has to be built on Windows - GitHub Actions with Linux and
      Windows in the same workflow, no Windows machine needed
    signing: >
      without a paid certificate, Windows shows the "Unknown publisher"
      warning (SmartScreen) - acceptable for 1.0, as long as users are told
    keys: >
      a keyring plugin that works on both systems - the part to design most
      carefully, linked to encryption.on_device_data_protection (issue #4)
  macos: possible with the same code, but requires Apple notarisation - left for 1.x

installation:
  status: design, comes in 0.6
  goal: a stranger installs the server with one command
  script: >
    an interactive install.sh that generates the .env, the keys (including
    the server's signing key, outside the DB) and the docker-compose, and
    starts everything
  script_questions:
    - domain (or local network / IP only)
    - HTTPS - bundled Caddy with Let's Encrypt, or an existing proxy in front
    - serve the web client, or apps only (Android / desktop)
    - >
      owner - created right away (the script asks for username and
      password), or by claim code (the script prints a code in the terminal
      and whoever enters it first in the app becomes owner)
    - federation on or off
    - (1.x) server mode - private / directory / open
  owner_never_automatic: >
    never "the first one to connect becomes owner" without a code - someone
    could get there before the owner. The claim code only shows up for
    whoever has access to the machine.
  containers: >
    Postgres, backend and Caddy as separate containers under a single
    `docker compose up` - for whoever installs it it is one command, and
    each piece is updated and backed up separately. A single image with
    everything inside is simpler to explain but more fragile to update.

screens_designed_on_canvas:
  - Conversation list
  - 1:1 conversation (with a name clash - identifier highlighted)
  - 1:1 conversation (no name clash - clean header)
  - Group conversation (two contacts with the same name "Pedro")
  - '"Typing" indicator (three animated dots)'
  - Stickers / GIFs / Emoji (tabs)
  - Contact profile (nickname, bubble colour, style)
  - My profile (photo, display name, own bubble colour)
  - Administration (federated servers, members)
  - Add contact (choice of method)
  - My QR code
  - Scan code (simulated camera)
  - Push notification samples

key_backup_and_restore:
  status: >
    outside 1.0 - to be rethought before implementing (see future_1_x). The
    model below stores the backup key on the server, which falls short of
    the privacy focus.
  trust_model: >
    The backup encryption key is stored on the server, so anyone with root
    access to the machine can read the backups. Acceptable because, at
    first, the only admin is the owner. For the encryption to hold even
    against the admin it would have to move to a key split across federated
    servers (Shamir, 2 of 3).
  what_goes_into_the_backup: [identity key, contacts, nicknames, bubble colours/styles, history]
  what_does_not:
    - session state (ratchets) - restoring it breaks forward secrecy, sessions are rebuilt
    - pre-keys - new ones are generated
  storage:
    local: home server (key_backups table)
    blob: encrypted with the user's backup key
    backup_key: stored on the server, encrypted by a server master key
    master_key: outside the database (container file/environment variable),
      so that a stolen DB dump doesn't expose the backups
    never_visible: no screen, endpoint or log shows the key
  restore_paths:
    1_old_device_available:
      mechanism: direct transfer by QR (option C)
      flow: the new device shows a QR, the old one scans and approves, end-to-end encrypted transfer
        (local network, or through the server if there is none)
      result: same identity + history, no admin involvement
    2_device_lost:
      mechanism: temporary code generated by the admin
      flow: the admin confirms the person's identity and generates the code, the user enters it
        on the new device, the server decrypts and delivers the backup
      result: same identity + history, contacts get no notification
  temporary_code:
    purpose: only confirms who the person is, it isn't and doesn't contain the encryption key
    validity: 15 minutes
    use: single, tied to a specific user
    max_attempts: 5, then it is invalidated
    effects: revokes the old devices (banned_devices)
    audit: recorded on the administration screen + an event to the user's active devices
      (if any are left)
  key_backups_table: [user_id, version, blob, created_at]
  to_refine:
    - history in the backup - text only, or text + media up to X MB?
    - frequency - proposal, automatic daily
    - how many versions to keep - proposal, the last 3
    - export to a file - useful if the home machine dies (links to "server access recovery")

multi_device:
  mechanism: >
    the same as option C of backup/restore - an already active (trusted)
    device approves the new one by QR and shares the local history directly
    with it, end-to-end encrypted. Same flow whether replacing a lost device
    (with the old one at hand) or adding a second device used at the same
    time (e.g. phone + web) - a single code for both cases, instead of two
    separate flows.
  no_old_device_available: uses the admin temporary-code path (see
    key_backup_and_restore) - identity recovered, but history only up to the
    last backup.
  delivery_to_every_device: >
    with more than one active device, the server only deletes the message
    from the outbox after ALL of them confirm delivery, not just the first
    (see message_delivery_and_state.retention).

group_scheme:
  mechanism: >
    Sender Keys (the same idea as Megolm) - each member encrypts with their
    own group key, a message encrypted only once regardless of the group
    size. Chosen over fan-out (encrypting one copy per device, which is what
    1:1 does today) because the O(N) cost only happens when membership
    changes, not on every message. Since vodozemac was dropped, we will have
    to implement it ourselves on the same @noble/* primitives. The group key
    is distributed to members through the existing 1:1 Double Ratchet
    sessions between devices. For huge groups (thousands of members) the
    reference is MLS (RFC 9420), where membership changes cost O(log N) -
    out of scope for now.
  history_for_new_members: >
    they don't see messages exchanged before they joined - consistent with
    the rest of the project (the server never keeps history), each group
    session starts "clean" for whoever joins.
  session_rotation: >
    the sender key rotates on ANY membership change - both when someone
    joins and when someone leaves/is removed, a new session is generated
    and resent to the current members. A single mechanism for both cases,
    with no extra special case in the code. It is what guarantees that
    whoever leaves/is kicked can no longer decrypt new messages.
  to_refine:
    - table schema (group, members, sender keys per sender)
    - management screen (create a group, add/remove a federated member)
    - outside the MVP (which is 1:1 only)

server_access_recovery:
  description: different from losing personal keys - this is about who controls the whole machine/app
  case_1_app_reachable_but_no_owner_access:
    problem: you are the only admin, there is nobody to generate the temporary code
      that regular users use to recover access
    solution: >
      a recovery command that only runs locally on the machine
      (e.g. docker exec chatapp reset-owner) - it doesn't go through the
      normal "admin approves admin" mechanism. Rationale: whoever gets in
      over SSH/physically is, by definition, more trustworthy than an admin
      inside the app (ssh is only reachable via VPN/LAN, never publicly
      exposed)
  case_2_machine_died:
    problem: failed disk, fire, theft - the home machine is gone
    gap_identified: >
      the master_key that decrypts the users' key_backups lives outside the
      DB, only in a container environment variable (decision in
      key_backup_and_restore). Without a separate copy, losing the machine
      means losing that key forever - even with the DB copied, every backup
      of every user becomes unreadable.
    what_to_copy_off_site: [database dump, master_key
      (the most critical), TLS certificates, Docker container configuration]
    destination: >
      two layers - (1) a USB stick/external disk always plugged into the
      machine, continuous automatic copy, protects against the main disk
      failing; (2) periodically (e.g. monthly) also copy to a second
      stick/disk physically taken elsewhere (a relative's/friend's house, or
      work), to cover fire/theft/flood - layer 1 alone doesn't protect
      against this, because it sits in the same place as the machine. No
      dependency on any other infrastructure or third-party service.
    frequency_and_reminder: to refine - proposal, a periodic reminder to the owner
      to update the stick taken off-site (e.g. monthly)

to_decide:
  - item: CGNAT on the connecting side
    description: use Cloudflare Tunnel if a federated friend is behind CGNAT
    priority: low
