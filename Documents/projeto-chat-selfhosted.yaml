projeto: WhattsPoppin - App de chat self-hosted federada
idiomas: >
  Documentação bilingue - este ficheiro é a versão em português; a versão em
  inglês é project-chat-selfhosted.yaml, na mesma pasta. As duas mudam
  sempre juntas.
dominio: whattspoppin.io (ou semelhante) - a tratar mais tarde (DNS, certificados, etc.)
licenca: AGPL-3.0 (escolha do owner, não imposta por nenhuma biblioteca)
versao: >
  0.1.0 (MVP concluído; SemVer - em 0.x a API e o protocolo ainda podem mudar).
  Em curso: 0.2.0 - federação entre servidores (ver proxima_versao e federacao).
  Caminho até à 1.0.0 em versao_1_0, e o que fica para depois em futuro_1_x
mvp: >
  Mensagens de texto 1:1 cifradas entre dois utilizadores do mesmo servidor,
  num só cliente. Sem federação, grupos, figurinhas ou push nesta primeira
  versão - tudo o resto constrói-se por cima disto.
conceito: >
  App tipo WhatsApp onde cada pessoa (ou grupo de amigos) corre o seu próprio
  servidor. Servidores federam entre si (como email), sem depender de
  infraestrutura de terceiros. Cifra ponta-a-ponta, sem serviços externos
  para media (figurinhas/GIFs).

estado_de_implementacao:
  resumo: >
    v0.1.0 - MVP concluído. Dois ou mais utilizadores conseguem criar
    conta, ver-se na lista e trocar mensagens de texto 1:1 em tempo real,
    cifradas ponta-a-ponta (X3DH + Double Ratchet próprios), com fila
    offline, estados de mensagem, lista de conversas viva, "a escrever" e
    nome de exibição editável - testado entre dispositivos diferentes na
    mesma rede local. Faltam várias peças do desenho final que foram
    conscientemente simplificadas para chegar aqui mais depressa. O que a
    1.0.0 tem de ter, e por que ordem, está em versao_1_0.
  construido:
    - repositório com frontend (Expo + React Native + TypeScript) e backend
      (FastAPI + Peewee + PostgreSQL), lint/typecheck/testes configurados
      nos dois lados
    - registo e login reais (username + password, hash com bcrypt) - sessão
      guardada como token no dispositivo, retomada automaticamente
    - >
      autenticação por sessão em tudo (F0 da 0.2.0) - o REST exige
      Authorization: Bearer <token>, o /ws exige {type: auth, token} como
      primeira mensagem (sem ela em 5 s, ou com token inválido, fecha com
      4401) - o token nunca vai na URL, para não ficar em logs. O user e o
      device saem sempre da sessão, nunca de ids mandados pelo cliente. Na BD
      só fica o SHA-256 do token (token_hash), e devices inativos não
      retomam sessão. Mensagens, recibos, "a escrever" e a lista de devices
      de uma conversa só funcionam para quem é participante dela (quem não é
      recebe 404, não fica a saber que a conversa existe); o prekey bundle
      só se pede com sessão, para ninguém de fora esgotar as OPKs
    - >
      identificador user@domínio (F2 da 0.2.0) - cada servidor tem o seu
      SERVER_NAME e cada conta um identificador (ex. alice@localhost:8001),
      devolvido no login/sessão e mostrado em "O meu perfil". users.domain
      fica NULL nas contas locais (só os utilizadores-sombra da F4 o
      preenchem), por isso mudar o SERVER_NAME não reescreve contas; o
      username é único por domínio, com dois índices parciais. Usernames em
      minúsculas (registo e login convertem), 3-32 caracteres de a-z 0-9 . _ -
    - >
      dois servidores em dev - dev/federation.sh arranca tudo num só
      terminal (Postgres, BD do B se faltar, os dois servidores e os dois
      clientes web, com prefixo por processo; Ctrl+C pára tudo). Por baixo,
      backend/dev/run-server.sh a|b arranca o
      servidor A (localhost:8001, BD de dev) ou B (localhost:8002, BD
      whattspoppin_b), com migrações e --host 0.0.0.0; npm run web:a|web:b
      arranca o cliente web de cada um (portas 8091/8092, localStorage
      separado). O frontend descobre sozinho o endereço do backend - na web
      pelo host da página, na app nativa pelo host do servidor do Expo -
      com EXPO_PUBLIC_API_URL para forçar outro
    - >
      identidade do servidor (F3 da 0.2.0, verificada à mão com os dois
      servidores de dev) - cada servidor tem uma chave
      Ed25519 (SERVER_SIGNING_KEY_PATH, fora da BD, criada no primeiro
      arranque com permissões 0600; backend/data/ e backend/dev/keys/ estão
      no .gitignore) e publica-a em GET /.well-known/whattspoppin/server.
      Os pedidos entre servidores levam o cabeçalho Authorization: WP-Sig e
      GET /_federation/v1/ping é o primeiro endpoint assinado (serve também
      de diagnóstico). Quem recebe (app/federation/auth.py, dependência
      federation_origin) recusa com 401 um cabeçalho inválido, um destino que
      não é este servidor, uma origem igual a este servidor ou que não é um
      domínio, um ts fora de ±5 minutos e uma assinatura que não verifica, e
      com 403 um domínio bloqueado. No primeiro contacto vai buscar a chave
      ao .well-known, verifica a assinatura e só então a fixa (TOFU) em
      federated_servers (migração 008); a partir daí não a volta a pedir.
      Se uma assinatura falhar e o .well-known passar a publicar outra chave,
      o pedido é recusado e a chave nova fica em changed_key e key_changed_at,
      sem substituir a fixada, à espera de um admin. Os pedidos de saída
      passam por app/federation/client.py (federation_request), que assina
      os mesmos bytes que envia; backend/dev/federation-ping.sh a
      localhost:8002 testa-o à mão. FEDERATION_ALLOW_HTTP=true, só nos .env
      de dev, permite http:// no .well-known e nos pedidos
    - lista de conversas mostra todos os utilizadores do servidor; a
      conversa só é criada na BD quando se abre pela primeira vez
      (get_or_create, não é pré-criada no registo)
    - mensagens de texto 1:1 em tempo real via WebSocket
    - lista atualiza-se sozinha quando alguém novo se regista (evento
      user_registered), sem refresh
    - WebSocket reconecta-se sozinho se o backend cair/reiniciar
    - mensagens persistem no dispositivo (AsyncStorage/localStorage) por
      utilizador, sobrevivem a um refresh da página
    - UI dividida em componentes pequenos e reutilizáveis (Avatar,
      MessageBubble, GradientButton, etc.)
    - cifra ponta-a-ponta em 1:1 - cada dispositivo publica IK, SPK
      assinada e 20 OPKs; a primeira mensagem abre sessão X3DH, depois
      Double Ratchet (chave nova por mensagem). Quem envia cifra um
      envelope por dispositivo do destinatário, o servidor entrega a cada
      um só o seu e nunca vê o texto. Desenho e decisões na secção cifra
    - pytest numa BD própria (TEST_DATABASE_URL, nome tem de acabar em
      _test) - nunca toca na BD de dev
    - fila offline no servidor (tabela pending_messages) - uma linha por
      envelope cifrado por device destinatário, entregue ao ligar por ordem
      de created_at, apagada só com ack desse device (logo, só sai do
      servidor quando TODOS os devices confirmarem). Cliente deduplica por
      (sender_device_id, client_message_id). Expira ao fim de 30 dias sem ack
    - estados de mensagem pending/sent/delivered/read na bolha - outbox local
      de quem envia (cifra uma vez, reenvia os mesmos bytes ao religar),
      "sent" quando o servidor guarda, "delivered" gerado pelo servidor no ack
      do destinatário, "read" quando o destinatário abre a conversa. Recibos
      passam pela mesma fila (pending_messages); só levam ids, nunca conteúdo
    - lista de conversas com última mensagem, hora (hoje HH:MM, "Ontem", dia
      da semana, data) e contagem de não lidas; a conversa mais recente sobe
      para o topo. A lista é por utilizador e as mensagens por conversa - a
      ponte (conversation_id → user_id) vem de other_users[].conversation_id
      no login/sessão e do sender_user_id que o servidor junta a cada
      mensagem (tirado da ligação, nunca do cliente). "Não lida" é estado
      local (seen), separado do recibo de leitura - abrir a conversa com o
      socket em baixo limpa o contador na mesma. Na web, o título do
      separador mostra o total por ler
    - indicador "a escrever" - evento typing no WebSocket, reencaminhado só
      aos devices ligados da conversa (nunca vai para a fila nem para a BD);
      aparece como bolha de três pontos no fundo da conversa e como
      "a escrever…" na lista. Detalhe em mensagens_entrega_e_estado.a_escrever
    - nome de exibição editável no ecrã "O meu perfil" (botão de definições
      da lista). Começa igual ao username do registo; PATCH
      /users/me/display_name com o token da sessão (trim, 1-80 caracteres);
      o servidor avisa os outros devices ligados com o evento user_updated,
      e a lista deles atualiza sem refresh. O username (para entrar) não muda
  simplificacoes_temporarias:
    - cifra só em 1:1 e com arestas conhecidas - inícios de sessão
      simultâneos podem perder as mensagens que se cruzam (sem arquivo de
      sessões), sem rotação de SPK, sem reposição automática de OPKs
    - sem federação a sério - já há identificador user@domínio e identidade
      do servidor (chave, .well-known, pedidos assinados, TOFU), mas os
      servidores ainda não trocam perfis, chaves nem mensagens (F4-F7 da
      0.2.0, ver proxima_versao)
    - >
      um pedido federado capturado pode ser reenviado dentro da janela de
      ±5 minutos (exige quebrar o TLS). O PUT /_federation/v1/send/{txn_id}
      da F6 é idempotente pelo txn_id
    - >
      o servidor vai buscar o .well-known ao domínio que quem lhe escreve
      indicar, incluindo endereços internos, e não limita pedidos - é
      inerente à federação aberta. Bloquear IPs privados fora de dev e
      limitar a taxa ficam para o deploy com HTTPS (ver instalacao)
    - >
      uma chave de servidor mudada fica só marcada em federated_servers
      (changed_key, key_changed_at) e o servidor continua recusado; aceitá-la
      ou rejeitá-la exige o ecrã de admin (ver papeis_e_administracao)
    - sem alcunha nem deteção de ambiguidade - mostra-se sempre o nome de
      exibição
    - registo aberto, sem código de convite nem aprovação de admin
    - >
      lista de conversas mostra todos os membros do servidor - sai na 0.3
      (passa a só contactos aceites) e volta como opção no modo diretório
      (ver modos_do_servidor)
    - >
      conversa consigo próprio partida - get_or_create_conversation(a, a)
      devolve outra conversa do utilizador ou dá erro 500, e
      find_recipient_device_ids exclui os devices do próprio. Resolve-se na 0.5
    - ecrã de login sem campo "Servidor" (assume-se sempre este servidor)
    - recibos de leitura sempre ligados (sem opção de privacidade) e sem
      estado "falhou" - uma mensagem que não se consegue cifrar fica pending
    - mensagens no cliente ficam em localStorage/AsyncStorage, não
      IndexedDB - decisão consciente de não otimizar prematuramente
      (quota ~5-10MB, muito acima do que se está a usar agora)
  falta:
    - proteger os dados no dispositivo - hoje, na web, mensagens E chaves
      privadas estão no localStorage sem cifra. Requisito - poder usar a
      web em qualquer máquina, incluindo partilhadas. Desenho (fora do
      MVP) em cifra.protecao_dos_dados_no_dispositivo
    - alcunhas, deteção de ambiguidade
    - backup e restauro de chaves (praticamente tudo, depende da cifra)
    - multi-dispositivo - hoje cada login novo cria um Device sem ligação
      nenhuma aos anteriores, sem partilha de histórico entre eles
    - federação (em curso, 0.2.0), grupos, figurinhas/GIFs, QR codes,
      notificações push
    - convites (servidor e contacto), pedidos de contacto e fim da lista
      global de utilizadores
    - anexos cifrados (ver anexos_cifrados)
    - administração (papéis, moderação, ecrã de admin)
    - instalação com um comando (ver instalacao)
    - apps Android e desktop (Tauri - Linux e Windows)
    - a ordem de tudo isto está em versao_1_0

proxima_versao:
  versao: 0.2.0
  tema: federação entre servidores
  objetivo: >
    alice@servidor-a e bob@servidor-b trocam mensagens 1:1 cifradas entre
    dois servidores independentes, com fila offline, recibos e "a escrever",
    sem o cliente falar com outro servidor que não o seu. Fechar isto marca
    a 0.2.0.
  porque_agora: >
    A federação é o que distingue o projeto e é a peça que mais mexe no que
    já existe (identificadores, modelo de dados, entrega). Páginas que
    faltam, convites, admin e proteção dos dados no dispositivo não mudam
    por causa dela, por isso ficam para depois; a autenticação entre
    servidores faz parte da própria federação e não se adia.
  fases:
    F0: >
      feito - autenticação local a sério - /ws e endpoints REST exigem o
      token da sessão, o user/device sai dele e não do cliente (detalhe em
      estado_de_implementacao.construido)
    F1: protocolo escrito na secção federacao deste yaml
    F2: >
      feito - identificador user@domínio (coluna domain em users, NULL nas
      contas locais) + ambiente de dev com dois servidores (duas BDs, portas
      8001/8002, clientes web em 8091/8092) - detalhe em
      estado_de_implementacao.construido
    F3: >
      feito - identidade do servidor (chave de assinatura, .well-known,
      assinatura e verificação de pedidos, tabela federated_servers com
      TOFU, marcação da chave mudada). Testes automáticos (ruff, mypy e
      pytest) e verificação manual com os dois servidores de dev feitas
      (federation-ping.sh nos dois sentidos, e recusa com a chave mudada
      depois de apagar a chave de A) - detalhe em
      estado_de_implementacao.construido
    F4: perfil remoto, utilizadores-sombra, ecrã "Adicionar contacto"
    F5: devices e prekey bundles remotos por proxy no servidor local
    F6: >
      entrega federada - federation_outbox + worker com backoff,
      PUT /_federation/v1/send/{txn_id}, recibos delivered/read entre servidores
    F7: >
      "a escrever" e mudanças de nome entre servidores (efémeros, sem retry)
  pronto_quando: >
    Dois servidores locais com um cliente cada - adicionar contacto do outro
    servidor, trocar mensagens nos dois sentidos com ✓/✓✓/lida, desligar o
    servidor B, enviar, religar e a mensagem chega, "a escrever" entre
    servidores, e mudar a chave do servidor B faz o A recusá-lo.
  fora_de_ambito: >
    verificação de identidade (número de segurança/QR - prioridade logo a
    seguir, porque as chaves passam a vir de servidores que não
    controlamos), deploy com HTTPS, ecrã de admin, grupos

versao_1_0:
  o_que_significa: >
    Pelo SemVer, a 1.0.0 é uma promessa - a partir daí o protocolo de
    federação e o formato dos dados só mudam com aviso e caminho de
    migração, porque outros servidores e os dados das pessoas passam a
    depender deles. Por isso só se chama 1.0 quando (1) um desconhecido
    consegue instalar o servidor em casa, convidar amigos e falar com outro
    servidor, e (2) não sobra nenhuma simplificação temporária de segurança.
  foco: privacidade acima de conveniência - na dúvida, a opção por omissão é a mais privada
  plataformas: >
    web, Android e desktop com Tauri (Linux em Flatpak; Windows sai do mesmo
    código). iOS e macOS ficam para a 1.x (ver futuro_1_x).
  pronto_quando:
    - >
      instalação com um comando (ver instalacao), com HTTPS, num domínio
      real, e o owner criado pelo script ou pelo código de reclamação
    - >
      registo só por convite; a lista de conversas só mostra contactos
      aceites, nunca todos os membros do servidor
    - >
      adicionar contacto por convite (QR, link ou código) com verificação
      automática da chave, e por user@domínio se o admin o permitir
    - >
      número de segurança e QR de verificação; aviso bem visível quando a
      chave de um contacto muda
    - >
      federação a funcionar entre servidores reais, com chave fixada (TOFU)
      e bloqueio de domínios
    - anexos cifrados (imagens e ficheiros), sem EXIF e com padding
    - conversa consigo próprio, sincronizada entre os próprios dispositivos
    - >
      todas as limitações de cifra.limitacoes_conhecidas resolvidas (menos
      grupos, que ficam para a 1.x) e revisão de segurança feita
    - dados protegidos no dispositivo em todas as plataformas
    - apps Android e desktop (Tauri) a funcionar ao lado da web
  caminho:
    '0.2':
      tema: federação (em curso, issue #19)
      conteudo: ver proxima_versao
    '0.3':
      tema: contactos e convites
      conteudo:
        - registo fechado por convite de servidor (QR / link / código)
        - convite de contacto com a chave de identidade - contacto verificado ao ler
        - >
          pedidos de contacto - ninguém te manda mensagens antes de o
          aceitares
        - >
          adicionar por user@domínio, só se o admin ligar a opção
          (contactos_por_identificador, desligada por omissão)
        - fim da lista global - a lista mostra só contactos aceites
        - número de segurança e verificação por QR (issue #3)
        - alcunhas e deteção de ambiguidade de nomes
    '0.4':
      tema: cifra endurecida e dispositivos
      conteudo:
        - proteção dos dados no dispositivo (issue #4)
        - ecrã "Os meus dispositivos" - ver, revogar, terminar sessão (issue #5)
        - reposição de OPKs (#6), arquivo de sessões (#7), rotação da SPK (#8), limite às chaves saltadas (#9)
        - bloqueio da app com PIN
    '0.5':
      tema: anexos cifrados e conversa consigo próprio
      conteudo:
        - anexos cifrados (ver anexos_cifrados) - desenho escrito antes do código
        - conversa consigo próprio - uma conversa com um só participante,
          entregue aos outros dispositivos do próprio utilizador
    '0.6':
      tema: servidor pronto para outras pessoas
      conteudo:
        - script de instalação e imagem Docker de produção (ver instalacao)
        - administração mínima - convites, membros (expulsar/banir), servidores federados
        - definições de privacidade - recibos de leitura e "a escrever" desligáveis, lista de bloqueados
        - retenção da fila e limites configuráveis (issue #16)
        - CORS fechado, Content-Security-Policy estrita
    '0.7':
      tema: apps
      conteudo:
        - Android - câmara para QR, push FCM sem conteúdo, APK direto / F-Droid
        - desktop Tauri - Linux (Flatpak) e Windows, chaves no cofre do sistema (ver desktop)
    1.0-rc:
      tema: congelar e rever
      conteudo:
        - protocolo de federação v1 congelado
        - revisão de segurança (issue #11) - externa se possível, senão interna escrita e pública
        - documentação de instalação e de migração entre versões
  ecras:
    ja_existem: [Login, Criar conta, Lista de conversas, Conversa, O meu perfil]
    novos:
      - Criar conta com convite (código ou QR obrigatório)
      - Adicionar contacto (ler QR, colar link, ou user@domínio se permitido)
      - O meu convite (o meu QR/link de contacto; revogar e gerar outro)
      - Pedidos de contacto (aceitar / recusar)
      - Detalhe do contacto (número de segurança, verificar por QR, alcunha, bloquear, estado verificado)
      - Os meus dispositivos (ver, revogar, terminar sessão)
      - Definições de privacidade (recibos, "a escrever", bloqueio da app, bloqueados)
      - Administração (convites, membros, servidores federados, opções do servidor)
    nota: >
      vários destes já estão desenhados no canvas (ver
      ecrãs_desenhados_no_canvas) - Adicionar contacto, O meu código QR,
      Digitalizar código e Administração
  fora_da_1_0: ver futuro_1_x

futuro_1_x:
  modos_do_servidor: >
    Diretório e Aberto/efémero (ver modos_do_servidor). A 1.0 sai só com o
    modo Privado, mas o código fica preparado para os outros entrarem sem
    mudar o protocolo.
  grupos: Sender Keys (ver esquema_de_grupos, issue #10)
  mensagens_temporarias: desaparecem ao fim de um prazo escolhido por conversa - boa para privacidade e relativamente simples
  multi_dispositivo: ligar um dispositivo novo por QR com partilha do histórico (ver multi_dispositivo)
  backup: >
    repensar antes de implementar - o desenho atual (backup_e_restauro_de_chaves)
    guarda a chave do backup no servidor, o que fica aquém do foco em
    privacidade
  temas: temas da app escolhidos pelo utilizador (extensão de personalizacao_de_bolhas)
  figurinhas_e_gifs: ver figurinhas_e_media
  plataformas: iOS e macOS (exigem conta de programador Apple, 99 USD/ano)

stack:
  frontend:
    framework: React Native (via Expo, suporta build web nativamente)
    ordem_de_plataformas: [web (MVP), mobile Android, desktop Linux e Windows (Tauri)]
    web: React Native Web - primeiro cliente a existir, usado para o MVP
    mobile: React Native - Android primeiro (mais barato/simples de testar,
      sem custo de Apple Developer nem revisão de loja). iOS fica para a 1.x.
    desktop: >
      DECIDIDO - Tauri a embrulhar o build web (o Expo não gera apps de
      desktop). Linux e Windows saem do mesmo código; detalhe em desktop.
    cifra_em_mobile_nativo: >
      RESOLVIDO pela mudança de biblioteca (ver secção cifra) - a
      implementação própria do Double Ratchet usa @noble/curves,hashes,
      ciphers, que são JavaScript/TypeScript puro sem WASM. Corre
      exactamente da mesma forma no Hermes (mobile) e no browser (web),
      sem precisar de nenhuma ponte nativa em Rust/JSI.
  backend:
    linguagem: Python
    framework: FastAPI (WebSockets nativos, async)
  base_de_dados:
    motor: PostgreSQL
    orm: Peewee (síncrono, chamado a partir do FastAPI via run_in_threadpool)
      - trocado da escolha inicial (SQLAlchemy) por ser mais simples e legível
    modelo: multi-tenant lógico (isolamento por user_id, não bases separadas)
  encriptacao: >
    X3DH + Double Ratchet próprios (specs do Signal) sobre @noble/curves,
    @noble/hashes e @noble/ciphers. O servidor nunca vê conteúdo. Desenho,
    decisões e limitações na secção cifra.
  infraestrutura:
    hosting: máquina física em casa, container Docker
    reverse_proxy: Caddy (HTTPS automático via Let's Encrypt)
    dns_dinamico: DuckDNS ou Cloudflare
    portas_abertas: [443, 80]
    ssh: só via VPN/LAN, nunca exposto publicamente

cifra:
  porque_implementacao_propria: >
    A vodozemac (Olm/Megolm) foi a escolha inicial, mas os bindings de
    JavaScript estão todos parados - o oficial arquivado, os forks da
    comunidade sem updates há mais de um ano, e a única opção mantida é o
    OlmMachine inteiro do Matrix, preso aos conceitos do protocolo deles.
    Implementámos X3DH + Double Ratchet seguindo à risca as especificações
    do Signal, em cima de primitivos auditados (@noble/curves,
    @noble/hashes, @noble/ciphers - JS puro, sem WASM, corre igual no
    Hermes e no browser). Nunca inventamos cifra, só o encadeamento de
    chaves.
  especificacoes:
    - https://signal.org/docs/specifications/x3dh/
    - https://signal.org/docs/specifications/doubleratchet/
  primitivos: >
    X25519 para DH; HKDF-SHA256 para o KDF_RK do Double Ratchet e para o KDF
    do X3DH (cada um com o seu info, para separação de domínio);
    HMAC-SHA256 para o KDF_CK; ChaCha20-Poly1305 como AEAD, com nonce
    aleatório de 12 bytes. Tudo em frontend/src/crypto/primitives.ts.
  chaves_por_dispositivo: >
    Identity key (IK, Ed25519), signed prekey (SPK, X25519, assinada pela IK)
    e 20 one-time prekeys (OPK, X25519, key_id aleatório de 32 bits). Geradas
    no registo e no login, partes públicas publicadas no servidor, privadas
    só no dispositivo. O servidor entrega cada OPK uma única vez e apaga-a.
  sessoes: >
    Uma sessão por par de dispositivos (o meu device, o device do outro),
    nunca por conversa nem por utilizador. Quem envia cifra um envelope por
    cada device do destinatário e o servidor entrega a cada um só o seu.
  decisoes:
    ik_ed25519_reutilizada_para_dh: >
      A IK é Ed25519 (assina a SPK) e é convertida para X25519 (mapa
      Edwards para Montgomery) para os DH do X3DH. Como a spec recomenda
      para este caso de reuso de chave, o input do KDF leva o prefixo F
      (32 bytes 0xFF).
    verificacao_da_spk: >
      Quem inicia a sessão verifica sempre a assinatura da SPK antes de
      qualquer DH - sem isto, um servidor comprometido podia trocar a SPK.
    associated_data: >
      AD = IK_A || IK_B (do X3DH). Cada mensagem autentica AD || cabeçalho,
      e o cabeçalho tem 40 bytes fixos (dh 32, pn 4, n 4, big-endian) - por
      isso adulterar o cabeçalho faz a decifra falhar.
    par_ratchet_inicial_de_bob: é a SPK dele, como a spec manda
    preludio_repetido: >
      Alice põe o prelúdio X3DH em todas as mensagens até decifrar a
      primeira resposta de Bob, como o Signal recomenda - perder a primeira
      mensagem não impede a seguinte de abrir a sessão. Bob distingue
      "repetição" de "sessão nova" pela chave efémera de Alice.
    opk_so_gasta_depois_de_decifrar: >
      A OPK só é apagada depois de a primeira mensagem decifrar, para uma
      mensagem adulterada não a queimar.
    estado_imutavel: >
      Cada operação do ratchet devolve um estado novo; se a decifra falhar o
      anterior fica intacto, e só se grava depois de sucesso.
    fila_em_serie: >
      Todas as operações de cifra e decifra passam por uma fila, para duas
      mensagens seguidas não gravarem a mesma sessão ao mesmo tempo.
    max_skip: >
      No máximo 1000 chaves saltadas por cadeia, e os contadores do
      cabeçalho são validados.
    cifrar_uma_vez: >
      A outbox de quem envia guarda os envelopes já cifrados; um reenvio
      manda os mesmos bytes e o ratchet não avança duas vezes.
  limitacoes_conhecidas:
    - >
      Sem verificação de identidade (número de segurança / QR, ver
      qr_codes). Protege contra quem escuta a rede, mas não contra um
      servidor comprometido que troque as chaves de alguém. É a lacuna mais
      importante.
    - Dados no dispositivo sem proteção própria (ver protecao_dos_dados_no_dispositivo)
    - >
      Inícios de sessão simultâneos podem perder as mensagens que se cruzam
      (falta um arquivo de sessões).
    - >
      Sem reposição automática de OPKs; esgotadas, as sessões novas perdem o
      DH4 (válido pela spec, mas mais fraco).
    - >
      Sem rotação da SPK. Como a SPK é também o primeiro par ratchet de Bob,
      a rotação tem de guardar a privada antiga durante um período.
    - Sem limite global às chaves saltadas guardadas (MKSKIPPED)
    - Cada login cria um device novo, e quem envia também cifra para os antigos
    - >
      Implementação própria - recomenda-se uma revisão de segurança externa
      antes de uso real.
  protecao_dos_dados_no_dispositivo:
    estado: desenho, fora do MVP
    problema: >
      Guardar as mensagens decifradas no dispositivo é o normal (o WhatsApp e
      o Signal também o fazem); a diferença é que eles protegem esse
      armazenamento. Aqui, na web, as mensagens E as chaves privadas estão no
      localStorage em claro - legíveis por qualquer script na página (XSS) e
      por quem aceda ao perfil do browser, e ficam lá depois de fechar a app.
    requisito: poder usar a web em qualquer máquina, incluindo partilhadas
    desenho:
      - >
        Um único módulo de armazenamento cifrado (ex. storage/vault.ts) por
        onde passam as chaves, as sessões e as mensagens, reutilizando o
        aeadEncrypt/aeadDecrypt que já existe.
      - Mobile - chave de armazenamento no expo-secure-store (Keychain/Keystore)
      - >
        Web numa máquina própria - chave WebCrypto não exportável no
        IndexedDB (protege contra cópia do perfil, não contra XSS).
      - >
        Web em qualquer máquina, por omissão - chave derivada de um PIN/frase
        com Argon2id (já incluído no @noble/hashes), nunca gravada.
      - Modo "computador público" opcional - nada persistido, só em memória
      - >
        Logout apaga as chaves, as sessões e as mensagens locais, e desativa
        o device no servidor.
      - >
        Uma máquina nova começa sem histórico; o histórico vem por ligação
        por QR (multi_dispositivo) ou por backup (backup_e_restauro_de_chaves).
      - >
        O XSS continua a ser o risco que sobra na web - Content-Security-Policy
        estrita e zero scripts de terceiros.
      - Migração dos dados que já existam em claro, na primeira execução
  trabalho_por_fazer: >
    Nas issues do GitHub - verificação de identidade, proteção dos dados no
    dispositivo, reposição de OPKs, arquivo de sessões, rotação da SPK,
    limite às chaves saltadas, grupos (Sender Keys) e revisão externa.

federacao:
  estado: desenho fechado, implementação em curso (0.2.0, ver proxima_versao)
  protocolo: >
    Próprio, HTTPS + JSON, com os endpoints entre servidores em
    /_federation/v1/... Matrix e XMPP foram postos de parte - o Matrix é
    enorme (salas como DAG, resolução de estado) e preso ao Olm/Megolm, que
    abandonámos; o XMPP obrigava a outro servidor ou a uma pilha XML nova e
    a trocar a cifra por OMEMO. Um protocolo pequeno encaixa na cifra que já
    existe.
  identificador: >
    user@domínio (ex. alice@casa.pt, ou localhost:8001 em dev). O domínio é
    o SERVER_NAME do servidor onde a conta vive. Na BD, users.domain fica
    NULL nas contas locais e só é preenchido nos utilizadores-sombra; o
    código para formatar e ler identificadores está em
    backend/app/services/identifiers.py.
  descoberta:
    endpoint: GET /.well-known/whattspoppin/server
    resposta: '{server_name, versions: ["1"], verify_keys: {"ed25519:1": <b64>}}'
    versoes: >
      o campo versions diz que versões do protocolo o servidor fala - dois
      servidores em versões diferentes escolhem a mais alta em comum
  chave_do_servidor: >
    Ed25519, gerada no primeiro arranque e guardada num ficheiro fora da BD
    (SERVER_SIGNING_KEY_PATH), pela mesma razão da chave_mestra - um dump da
    BD roubado não chega para alguém se fazer passar pelo servidor.
  autenticacao_dos_pedidos:
    mecanismo: >
      Cada pedido entre servidores vai assinado (não só o primeiro), num
      header estilo Matrix:
      Authorization: WP-Sig origin="a",destination="b",key="ed25519:1",ts="...",sig="..."
    o_que_se_assina: >
      JSON canónico {method, uri, origin, destination, ts, content_sha256}
    rejeita: >
      ts fora de ±5 minutos, destination diferente do nosso SERVER_NAME,
      servidor bloqueado, ou chave diferente da fixada
  confianca_na_chave_remota:
    modelo: TOFU (trust on first use)
    como: >
      no primeiro contacto vai-se buscar a chave ao .well-known (por HTTPS)
      e fixa-se em federated_servers. Se mais tarde a chave for outra,
      recusa-se e regista-se - nunca se aceita sozinho.
    porque_nao_handshake: >
      o desenho inicial tinha um desafio + assinatura bidirecional; com todos
      os pedidos assinados é uma ida e volta a mais sem ganho real
  tabela_federated_servers: >
    [domain (PK), key_id, verify_key (base64), trust_status, first_seen_at,
    last_seen_at, changed_key, key_changed_at] - changed_key e key_changed_at
    só se preenchem quando o servidor passa a publicar outra chave (a fixada
    em verify_key nunca é substituída sozinha)
  configuracao: >
    SERVER_NAME (domínio deste servidor), SERVER_SIGNING_KEY_PATH (ficheiro
    da chave, por omissão backend/data/signing.key) e FEDERATION_ALLOW_HTTP
    (false por omissão - HTTPS obrigatório; só os .env de dev, em
    backend/dev/, o põem a true)
  modos:
    aberto: trusted automático no primeiro contacto (default escolhido, o único na 0.2.0)
    restrito: fica pending até admin aprovar (vem com o ecrã de admin)
  bloqueio: admin pode bloquear um domínio a qualquer momento (trust_status = blocked)
  quem_pode_iniciar_contacto_federado: qualquer membro, não só admins
  utilizadores_remotos: >
    Guardados como utilizadores-sombra (linha em users com o domain remoto
    e sem password), e os devices deles como linhas em devices só com
    chaves públicas. Assim as conversas e participantes continuam a usar as
    mesmas tabelas. Um device id que já pertença a outro domínio é recusado.
  conversas: >
    Os ids de conversa não saem do servidor. Os eventos federados levam
    identificadores de utilizador (alice@a, bob@b) e cada servidor traduz
    para a sua conversa local (get_or_create_conversation). Assim nenhum
    servidor tem de confiar em ids inventados por outro.
  cliente_so_fala_com_o_seu_servidor: >
    Devices e prekey bundles de utilizadores remotos são pedidos ao próprio
    servidor, que os vai buscar ao remoto (proxy). O cliente não precisa de
    CORS para outros domínios nem revela o IP a servidores alheios, e a
    cifra no frontend não muda.
  endpoints:
    - GET  /_federation/v1/ping                           # {origin, server_name} - assinado, diagnóstico (F3)
    - GET  /_federation/v1/users/{username}/profile       # {identifier, display_name}
    - GET  /_federation/v1/users/{username}/devices       # devices ativos com chaves
    - POST /_federation/v1/devices/{id}/prekey-bundle     # POST porque gasta uma OPK
    - PUT  /_federation/v1/send/{txn_id}                  # {events: [...]}
  eventos:
    duraveis: >
      message e receipt - passam pela federation_outbox do lado de quem
      envia (ver mensagens_entrega_e_estado.offline_federado)
    efemeros: >
      typing e user_updated - uma tentativa, sem retry, nunca gravados
  validacao_no_recetor: >
    o domínio do remetente tem de ser igual ao origin do pedido assinado, e
    o device destino tem de pertencer a um utilizador local. Duplicados
    (reenvio depois de um timeout) já são descartados pelo cliente por
    (sender_device_id, client_message_id).
  dependencias: >
    cryptography (Ed25519 do servidor) e httpx2 (cliente HTTP entre
    servidores, passa de dev para runtime - é o sucessor do httpx e o que o
    TestClient do Starlette já usa, por isso fica uma só biblioteca). Sem Redis nem Celery - a fila é
    uma tabela no Postgres e o worker uma tarefa asyncio no lifespan do FastAPI.
  testes: >
    O Peewee usa uma BD global, por isso não se sobem dois servidores no
    mesmo processo de teste - pedidos de entrada testam-se com TestClient e
    uma chave de teste, os de saída e o worker com o MockTransport do httpx2. O
    teste ponta-a-ponta é manual, com dois servidores (8001/8002).

papeis_e_administracao:
  papeis: [owner, admin, member]
  moderacao:
    kick: remove, pode voltar a registar-se com novo convite
    ban: remove e bloqueia chave/dispositivo (banned_devices)
  ecrã_admin:
    - servidores federados (aprovar / rejeitar / bloquear / desbloquear)
    - membros (expulsar, gerar convites)
    - opções do servidor (contactos_por_identificador, e mais tarde o modo do servidor)

modos_do_servidor:
  estado: na 1.0 só existe o modo privado; os outros ficam para a 1.x (futuro_1_x)
  privado:
    padrao: true
    registo: só por convite
    lista: só os contactos aceites
    exemplo: família, amigos
  diretorio:
    registo: só convites gerados por admin
    lista: todos os membros aparecem sozinhos na lista uns dos outros
    exemplo: empresa com todos os colegas já na lista
  aberto_efemero:
    registo: qualquer pessoa, sem convite
    lista: todos os membros
    rotacao: a BD roda (é apagada) diariamente - contas, chaves e mensagens desaparecem
    exemplo: servidor de um café para os clientes se conhecerem
    cuidados:
      - >
        limites contra abuso (contas por hora por IP, rate limit, captcha
        simples) - um servidor aberto sem limites é spam garantido
      - federação desligada por omissão, para não ser porta de entrada anónima para outros servidores
      - >
        os clientes têm de reconhecer que a conta expirou depois da rotação
        e voltar ao registo, em vez de ficarem em erro
      - a cifra ponta-a-ponta mantém-se; só muda a visibilidade de quem existe
  porque_privado_por_omissao: >
    listar todos os membros do servidor a qualquer utilizador revela quem
    lá tem conta; mostrar os membros tem de ser uma escolha explícita do
    admin, nunca o comportamento por omissão

contactos:
  regra: >
    Ninguém te manda mensagens antes de aceitares o pedido de contacto (ou
    de o adicionares tu por convite).
  formas_de_adicionar:
    convite_de_contacto: >
      QR, link ou código com user@domínio + impressão digital da chave de
      identidade (ver qr_codes). Ao ler, o contacto fica logo verificado.
    por_identificador: >
      escrever user@domínio. Só funciona se o admin ligar
      contactos_por_identificador (desligada por omissão). O contacto fica
      "por verificar" até se compararem os números de segurança.
  pedidos_de_outros_servidores: >
    por decidir quando se implementar - proposta, a opção
    contactos_por_identificador do NOSSO servidor também decide se aceitamos
    pedidos por identificador vindos de fora
  mudanca_de_chave: aviso bem visível na conversa e no detalhe do contacto; o contacto volta a "por verificar"

identidade_e_nomes:
  camadas:
    1: identificador técnico (user@servidor.pt) - nunca aparece na UI normal
    2: nome de exibição - escolhido pelo próprio, federado, visível a todos
    3: alcunha - só o dono da conta vê, local, nunca sai do servidor
  prioridade_exibicao: alcunha > nome de exibição > identificador
  deteccao_de_ambiguidade:
    descricao: >
      Quando duas alcunhas/nomes de exibição coincidem (case-insensitive),
      ambos os contactos ficam marcados como ambíguos e a app mostra o
      identificador em cor vibrante no cabeçalho (1:1 e em grupos). Fica na
      versão final, não é só um detalhe de mockup - previne impersonação.
    tabela_apoio: contact_name_counts (owner_user_id, effective_name_lower, count)
    motivo: evita recalcular a lista toda de contactos a cada mudança de nome
    atualizacao: incremental - só toca nas poucas linhas que partilham o nome que mudou
    propagacao: servidor calcula uma vez e envia evento contact_ambiguity_changed via
      WebSocket a todos os dispositivos ligados, para consistência multi-device

personalizacao_de_bolhas:
  cores: lista fechada de presets (nunca cor livre), por contacto (recebida) e própria (enviada)
  estilos: [sólido, contorno, padrão]
  armazenamento: local, nunca federado

mensagens_entrega_e_estado:
  estados: [pending, delivered, read]
  online: entrega via WebSocket
  offline_local: fica pending, entregue no reconnect (ordenado por created_at)
  offline_federado:
    mecanismo: federation_outbox
    tabela: [id, destination, payload, attempts, next_attempt_at, status, created_at]
    fluxo: >
      o servidor de quem envia grava o envelope na federation_outbox (e
      manda logo o recibo "sent" - a partir daí não se perde); um worker
      envia por ordem de created_at, por destino, com PUT
      /_federation/v1/send/{txn_id}; o servidor recetor põe na
      pending_messages do device destino como numa mensagem local
    worker: >
      tarefa asyncio no lifespan do FastAPI; pega nas linhas devidas com
      FOR UPDATE SKIP LOCKED
    retry: backoff exponencial com teto de 1 hora, máx. configurável, depois status = dead
  confirmacao_leitura:
    mecanismo: mesmo outbox, evento read_receipt
  retencao:
    servidor: >
      efémero - apaga a mensagem assim que é entregue a TODOS os dispositivos
      ativos do destinatário (não só o primeiro). Nunca guarda histórico a
      longo prazo, coerente com a cifra ponta-a-ponta.
    cliente: >
      persiste localmente para sempre, numa tabela simples
      (messages: id, conversation_id, sender_id, texto_decifrado, created_at),
      até o utilizador apagar. É o que entra no backup cifrado
      (ver backup_e_restauro_de_chaves) e o que viaja na partilha entre
      dispositivos (ver multi_dispositivo).
    mvp: mesmo modelo desde o início, sem simplificação - custo extra é mínimo
      (uma tabela pequena) e evita reconstruir isto mais tarde
  a_escrever:
    persistencia: nenhuma - nunca gravado em BD
    retry: nenhum - evento efémero, só WebSocket
    cliente: debounce (~3s desde a última tecla), envia stop explícito ao enviar mensagem
    implementado:
      envio: >
        typing=true na primeira tecla, repetido no máximo a cada 3s enquanto
        escreve; typing=false após 3s sem teclas, ao enviar, ao apagar o
        texto todo e ao sair do ecrã (messaging/typingSignal.ts)
      rececao: >
        expira sozinho ao fim de 5s sem novo evento (cobre um false perdido
        ou o outro lado a cair) e é limpo quando chega uma mensagem dessa
        conversa
      servidor: >
        só reencaminha para os devices da conversa que estão ligados agora,
        com sender_user_id tirado da ligação

notificacoes_push:
  mobile:
    obrigatorio: APNs (iOS) e FCM (Android), mesmo sem publicar em loja
    conteudo_no_push: nenhum - só "acorda" a app, que vai buscar e decifra localmente
    custos: [Apple Developer 99 USD/ano, Firebase gratuito]
    instalacao_sem_loja: [sideload apk (Android), TestFlight (iOS)]
  desktop:
    mecanismo: >
      WebSocket sempre aberto + notificações nativas pelo plugin de
      notificações do Tauri (D-Bus no Linux, notificações do Windows)
    push_externo: não aplicável
  web: notificações do browser enquanto o separador está aberto

qr_codes:
  convite_registo: "whattspoppin://join?server=...&invite=...&pin=<hash-chave-publica-servidor>"
  contacto_federado: "whattspoppin://contact?id=...&key=<chave-publica-identidade>"
  seguranca: verificação visual tipo "número de segurança" do Signal
  convite_de_servidor:
    quem_gera: admin (e membros, se o admin deixar)
    uso: único, com validade, revogável
    pin_da_chave_do_servidor: >
      o convite leva a impressão digital da chave do servidor - a app
      recusa-se a registar se o servidor responder com outra chave (protege
      contra alguém que se faça passar pelo servidor)
  convite_de_contacto:
    quem_gera: qualquer utilizador
    revogavel: sim - gerar um novo invalida o anterior
  tres_formas_de_partilhar: >
    QR (gerado na app; lido com a câmara no Android, com a webcam no desktop
    e na web), link whattspoppin:// (colar) e código em texto (sem câmara).
    O QR é o ideal, o link e o código garantem que funciona sempre.

figurinhas_e_media:
  upload: utilizadores fazem upload de imagens (figurinhas, GIFs, memes) para
    o próprio servidor - sem serviço externo, coerente com o resto do projeto
  deduplicacao: >
    armazenamento endereçado por conteúdo (content-addressable) - a imagem é
    guardada uma só vez, identificada pelo hash do seu conteúdo (ex. SHA-256).
    Se a mesma imagem for enviada/reutilizada de novo, o servidor reconhece
    o hash e não grava outra cópia - só liga (referencia) a mesma imagem já
    existente. Aplica-se tanto ao que é carregado explicitamente para a
    coleção como a imagens usadas em conversas que se tornam reutilizáveis
    como "memes".
  so_para_a_colecao_publica: >
    A deduplicação vale só para a coleção pública de figurinhas. NUNCA para
    anexos privados - deduplicar ficheiros cifrados obriga a usar a mesma
    chave para o mesmo ficheiro (convergent encryption), e isso revela quem
    tem o mesmo ficheiro. Ver anexos_cifrados.
  por_afinar:
    - tabela de referência (media_id/hash, quem pode reutilizar, contagem de uso)
    - ecrã de gestão da coleção (fica fora do MVP)

anexos_cifrados:
  estado: desenho, entra na 0.5 (obrigatório na 1.0)
  esquema: >
    O mesmo do Signal. O cliente gera uma chave aleatória por ficheiro, cifra
    o ficheiro em blocos (um vídeo grande não cabe na memória do browser) e
    envia só o blob cifrado para o PRÓPRIO servidor. A mensagem cifrada
    ponta-a-ponta leva {blob_id, chave, hash, tamanho, tipo, nome,
    miniatura}. O ficheiro sobe uma vez; a chave vai dentro de cada envelope
    (um por dispositivo destinatário). O servidor nunca vê a chave, o nome
    nem o tipo.
  privacidade:
    exif: >
      fotos levam GPS, modelo do telemóvel e data - removidos no cliente
      ANTES de cifrar. Essencial.
    padding: o blob é arredondado para escalões de tamanho, para o tamanho exato não identificar o ficheiro
    sem_deduplicacao: chave aleatória por ficheiro, nunca convergent encryption (ver figurinhas_e_media)
    miniaturas: geradas no cliente e enviadas cifradas dentro da mensagem - o servidor nunca gera pré-visualizações
  retencao: >
    o blob é apagado quando todos os dispositivos destinatários confirmarem
    o download, ou ao fim do mesmo prazo da fila offline. Precisa de um ack
    próprio para o download, separado do ack da mensagem.
  federacao: >
    quem está noutro servidor pede o blob ao SEU servidor, que o vai buscar
    ao remoto com um pedido assinado - o cliente só fala com o próprio
    servidor (ver federacao.cliente_so_fala_com_o_seu_servidor)
  limites:
    - tamanho máximo por ficheiro e quota por utilizador, configuráveis pelo admin
    - upload em blocos que retoma se a ligação cair
    - >
      o servidor não consegue procurar malware nos ficheiros - é o preço da
      cifra, assumido
  por_afinar:
    - AEAD para os blocos (proposta - XChaCha20-Poly1305 em blocos, do @noble/ciphers)
    - escalões do padding
    - valores por omissão dos limites

desktop:
  tecnologia: Tauri a embrulhar o build web do Expo
  porque: >
    o Expo não gera apps de desktop; o Tauri usa o motor web do sistema,
    por isso a app fica leve (ao contrário do Electron), e o mesmo código
    serve Linux e Windows
  por_sistema:
    linux:
      motor_web: WebKitGTK
      chaves: Secret Service (libsecret)
      links: registo de whattspoppin:// no ficheiro .desktop
      pacote: Flatpak (e AppImage)
      permissoes_previstas: [rede, notificações, câmara (QR scanner), ficheiros (media)]
      distribuicao: Flathub ou self-hosted (.flatpakref no próprio domínio)
    windows:
      motor_web: WebView2 (já vem no Windows 10/11)
      chaves: Credential Manager / DPAPI
      links: registo de whattspoppin:// no instalador
      pacote: .msi / .exe
  custos_reais:
    build: >
      o Windows tem de ser compilado em Windows - GitHub Actions com Linux e
      Windows no mesmo workflow, sem ser preciso ter uma máquina Windows
    assinatura: >
      sem certificado pago, o Windows mostra o aviso "Editor desconhecido"
      (SmartScreen) - aceitável na 1.0, avisando os utilizadores
    chaves: >
      um plugin de keyring que funcione nos dois sistemas - é a parte a
      desenhar com mais cuidado, liga a
      cifra.protecao_dos_dados_no_dispositivo (issue #4)
  macos: possível com o mesmo código, mas exige a notarização da Apple - fica para a 1.x

instalacao:
  estado: desenho, entra na 0.6
  objetivo: um desconhecido instala o servidor com um comando
  script: >
    install.sh interativo que gera o .env, as chaves (incluindo a chave de
    assinatura do servidor, fora da BD) e o docker-compose, e arranca tudo
  perguntas_do_script:
    - domínio (ou só rede local / IP)
    - HTTPS - Caddy incluído com Let's Encrypt, ou já existe um proxy à frente
    - servir o cliente web, ou só apps (Android / desktop)
    - >
      owner - criado já (o script pede username e password), ou por código
      de reclamação (o script mostra um código no terminal e quem o
      introduzir primeiro na app fica owner)
    - federação ligada ou desligada
    - (1.x) modo do servidor - privado / diretório / aberto
  owner_nunca_automatico: >
    nunca "o primeiro que se ligar fica owner" sem código - alguém podia
    chegar antes do dono. O código de reclamação só aparece a quem tem acesso
    à máquina.
  contentores: >
    Postgres, backend e Caddy como contentores separados sob um só
    `docker compose up` - para quem instala é um comando, e cada peça
    atualiza-se e faz backup à parte. Uma imagem única com tudo lá dentro é
    mais simples de explicar mas mais frágil a atualizar.

ecrãs_desenhados_no_canvas:
  - Lista de conversas
  - Conversa 1:1 (com conflito de nome - identificador em destaque)
  - Conversa 1:1 (sem conflito de nome - cabeçalho limpo)
  - Conversa de grupo (dois contactos com o mesmo nome "Pedro")
  - Indicador "a escrever" (três pontos animados)
  - Figurinhas / GIFs / Emoji (separadores)
  - Perfil de contacto (alcunha, cor da bolha, estilo)
  - O meu perfil (foto, nome de exibição, cor da bolha própria)
  - Administração (servidores federados, membros)
  - Adicionar contacto (escolha de método)
  - O meu código QR
  - Digitalizar código (câmara simulada)
  - Amostras de notificações push

backup_e_restauro_de_chaves:
  estado: >
    fora da 1.0 - a repensar antes de implementar (ver futuro_1_x). O modelo
    abaixo guarda a chave do backup no servidor, o que fica aquém do foco em
    privacidade.
  modelo_de_confianca: >
    A chave de cifra do backup fica guardada no servidor, por isso quem tiver
    acesso root à máquina consegue ler os backups. Aceitável porque, no início,
    o único admin é o owner. Para a cifra valer mesmo contra o admin é preciso
    migrar para chave partida entre servidores federados (Shamir, 2 de 3).
  o_que_entra_no_backup: [chave de identidade, contactos, alcunhas, cores/estilos das bolhas, histórico]
  o_que_nao_entra:
    - estado das sessões (ratchets) - restaurar quebra forward secrecy, sessões refazem-se
    - pre-keys - geram-se novas
  armazenamento:
    local: servidor de casa (tabela key_backups)
    blob: cifrado com a chave de backup do utilizador
    chave_de_backup: guardada no servidor, cifrada por uma chave mestra do servidor
    chave_mestra: fora da base de dados (ficheiro/variável de ambiente do container),
      para que um dump da BD roubado não exponha os backups
    nunca_visivel: nenhum ecrã, endpoint ou log mostra a chave
  caminhos_de_restauro:
    1_dispositivo_antigo_disponivel:
      mecanismo: transferência direta por QR (opção C)
      fluxo: dispositivo novo mostra QR, o antigo lê e aprova, transferência cifrada ponta-a-ponta
        (rede local, ou via servidor se não houver)
      resultado: mesma identidade + histórico, sem intervenção do admin
    2_dispositivo_perdido:
      mecanismo: código temporário gerado pelo admin
      fluxo: admin confirma a identidade da pessoa e gera o código, o utilizador introduz-o
        no dispositivo novo, o servidor decifra e entrega o backup
      resultado: mesma identidade + histórico, os contactos não recebem nenhum aviso
  codigo_temporario:
    funcao: só confirma quem é a pessoa, não é nem contém a chave de cifra
    validade: 15 minutos
    uso: único, ligado a um utilizador específico
    tentativas_max: 5, depois fica invalidado
    efeitos: revoga os dispositivos antigos (banned_devices)
    auditoria: registado no ecrã de administração + evento para os dispositivos
      ativos do utilizador (se ainda houver algum)
  tabela_key_backups: [user_id, version, blob, created_at]
  por_afinar:
    - histórico no backup - só texto, ou texto + media até X MB?
    - frequência - proposta, automático diário
    - quantas versões guardar - proposta, as últimas 3
    - exportar para ficheiro - útil se a máquina de casa morrer (liga a "recuperação de acesso ao servidor")

multi_dispositivo:
  mecanismo: >
    igual à opção C do backup/restauro - um dispositivo já ativo (trusted)
    aprova o novo por QR e partilha o histórico local diretamente com ele,
    cifrado ponta-a-ponta. Mesmo fluxo quer seja para substituir um
    dispositivo perdido (com o antigo à mão) quer para adicionar um segundo
    dispositivo em uso simultâneo (ex: telemóvel + web) - um único código
    para os dois casos, em vez de dois fluxos separados.
  sem_dispositivo_antigo_disponivel: usa o caminho do código temporário do
    admin (ver backup_e_restauro_de_chaves) - identidade recuperada, mas só
    histórico até ao último backup.
  entrega_a_todos_os_dispositivos: >
    com mais de um dispositivo ativo, o servidor só apaga a mensagem do
    outbox depois de TODOS confirmarem entrega, não só o primeiro
    (ver mensagens_entrega_e_estado.retencao).

esquema_de_grupos:
  mecanismo: >
    Sender Keys (a mesma ideia do Megolm) - cada membro cifra com a sua
    própria chave de grupo, mensagem cifrada uma só vez independente do
    tamanho do grupo. Escolhida em vez de fan-out (cifrar uma cópia por
    dispositivo, que é o que o 1:1 faz hoje) porque o custo O(N) passa a
    ser só quando os membros mudam, não em cada mensagem. Como a vodozemac
    foi abandonada, terá de ser implementado por nós em cima dos mesmos
    primitivos @noble/*. Chave de grupo distribuída aos membros através
    das sessões Double Ratchet 1:1 já existentes entre os dispositivos.
    Para grupos enormes (milhares de membros) a referência é o MLS
    (RFC 9420), em que mudar membros custa O(log N) - fora de âmbito por
    agora.
  historico_para_novos_membros: >
    não veem mensagens trocadas antes de entrarem - consistente com o resto
    do projeto (servidor nunca guarda histórico), cada sessão de grupo
    começa "limpa" para quem entra.
  rotacao_de_sessao: >
    a sender key roda em QUALQUER mudança de membros - tanto ao entrar
    como ao sair/ser removido alguém, gera-se sessão nova e reenvia-se aos
    membros atuais. Um único mecanismo para os dois casos, sem caso especial
    a mais no código. É o que garante que quem sai/é expulso deixa de
    conseguir decifrar mensagens novas.
  por_afinar:
    - esquema de tabelas (grupo, membros, sender keys por remetente)
    - ecrã de gestão (criar grupo, adicionar/remover membro federado)
    - fica fora do MVP (que é só 1:1)

recuperacao_de_acesso_ao_servidor:
  descricao: distinto de perder chaves pessoais - aqui é sobre quem controla a máquina/app toda
  caso_1_app_acessivel_mas_sem_acesso_de_owner:
    problema: és o único admin, não há ninguém para gerar o código temporário
      que os utilizadores normais usam para recuperar acesso
    solucao: >
      comando de recuperação que só corre localmente na máquina
      (ex. docker exec chatapp reset-owner) - não passa pelo mecanismo normal
      de "admin aprova admin". Justificação: quem chega por SSH/fisicamente
      já é, por definição, mais confiável que um admin dentro da app
      (ssh já só é acessível via VPN/LAN, nunca exposto publicamente)
  caso_2_maquina_morreu:
    problema: disco avariado, incêndio, roubo - a máquina de casa desaparece
    gap_identificado: >
      a chave_mestra que decifra os key_backups dos utilizadores fica fora
      da BD, só numa variável de ambiente do container (decisão em
      backup_e_restauro_de_chaves). Sem cópia à parte, perder a máquina
      significa perder essa chave para sempre - mesmo com a BD copiada,
      todos os backups de todos os utilizadores ficam ilegíveis.
    o_que_copiar_para_fora_de_casa: [dump da base de dados, chave_mestra
      (o mais crítico), certificados TLS, configuração dos containers Docker]
    destino: >
      duas camadas - (1) uma pen/disco externo sempre ligado à máquina,
      cópia automática contínua, protege contra falha do disco principal;
      (2) periodicamente (ex. mensal) copiar também para uma segunda
      pen/disco levado fisicamente para outro lado (casa de
      familiar/amigo, ou trabalho), para cobrir incêndio/roubo/inundação
      - a camada 1 sozinha não protege contra isto, porque fica no mesmo
      local que a máquina. Sem depender de mais nenhuma infraestrutura ou
      serviço de terceiros.
    frequencia_e_lembrete: por afinar - proposta, lembrete periódico ao owner
      para atualizar a pen levada para fora (ex. mensal)

por_decidir:
  - item: CGNAT do lado de quem se liga
    descricao: usar Cloudflare Tunnel se um amigo federado estiver atrás de CGNAT
    prioridade: baixa
