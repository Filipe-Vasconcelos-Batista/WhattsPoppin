services:
  postgres:
    image: postgres:17-alpine
    container_name: whattspoppin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whattspoppin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whattspoppin}
      POSTGRES_DB: ${POSTGRES_DB:-whattspoppin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whattspoppin}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
